# Collecte : scrape à 15 s pour vLLM, DCGM (chart GPU Operator) et EPP. Les noms de ports sont ceux
# observés sur KServe v0.21.0 (le port du Service workload s'appelle "http" depuis 0.21, "https" en 0.18 : piège C7).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-vllm
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [{{ .Values.namespace }}] }
  selector:
    matchLabels:
      app.kubernetes.io/component: llminferenceservice-workload
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scheme: http
      relabelings:
        - { sourceLabels: [__meta_kubernetes_pod_name], targetLabel: pod }
        - { sourceLabels: [__meta_kubernetes_namespace], targetLabel: namespace }
        - { sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name], targetLabel: llmisvc }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-epp
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [{{ .Values.namespace }}] }
  selector:
    matchLabels:
      app.kubernetes.io/component: llminferenceservice-router-scheduler
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        - { sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name], targetLabel: llmisvc }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: lab-istio-gateway
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [{{ .Values.namespace }}] }
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: inference-gateway
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-istiod
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [istio-system] }
  selector:
    matchLabels:
      app: istiod
  endpoints:
    - port: http-monitoring
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-litellm
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [gateway] }
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  endpoints:
    # Port de métriques dédié (v1.101+) ; le chemin se termine par "/" (sinon redirection 307).
    - port: metrics
      path: /metrics/
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: lab-argocd
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [argocd] }
  selector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-cert-manager
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [cert-manager] }
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  endpoints:
    - port: tcp-prometheus-servicemonitor
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-kserve
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [kserve] }
  selector:
    matchLabels:
      app.kubernetes.io/name: llmisvc-controller-manager
  endpoints:
    - port: https
      scheme: https
      tlsConfig: { insecureSkipVerify: true }
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: 30s
      relabelings:
        - { action: keep, sourceLabels: [__meta_kubernetes_service_name], regex: llmisvc-controller-manager-service }
