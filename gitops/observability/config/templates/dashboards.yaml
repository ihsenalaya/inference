{{- range $path, $_ := .Files.Glob "dashboards/**/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dash-{{ base $path | trimSuffix ".json" | lower | replace "_" "-" }}
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ base (dir $path) | quote }}
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
