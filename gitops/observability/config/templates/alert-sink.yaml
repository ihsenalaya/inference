# Récepteur d'alertes par défaut (si ALERT_WEBHOOK_URL est vide) : journalise chaque POST d'Alertmanager.
apiVersion: v1
kind: Service
metadata: { name: alert-sink, namespace: monitoring }
spec:
  selector: { app.kubernetes.io/name: alert-sink }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alert-sink, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: alert-sink } }
  template:
    metadata: { labels: { app.kubernetes.io/name: alert-sink } }
    spec:
      containers:
        - name: sink
          image: mendhak/http-https-echo:39
          env:
            - { name: HTTP_PORT, value: "8080" }
            - { name: HTTPS_PORT, value: "8443" }
            - { name: LOG_IGNORE_PATH, value: /healthz }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 5m, memory: 48Mi }
            limits: { memory: 128Mi }
