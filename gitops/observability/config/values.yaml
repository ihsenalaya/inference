scenario: baseline-7b
env: azure
namespace: inference
gpuHourlyPrice: "0.526"
runbookBase: https://github.com/ihsenalaya/inference/blob/main/docs/runbooks
# Seuils d'alerte. Les seuils SLO sont posés après la première mesure (docs/BASELINE.md), pas inventés :
# valeurs larges par défaut, à resserrer dans gitops/scenarios/<nom>.yaml (clé alertThresholds).
alertThresholds:
  ttftP95Seconds: 5
  itlP95Seconds: 0.5
  e2eP95Seconds: 60
  queueP95Seconds: 5
  errorRatio: 0.05
  waitingRequests: 4
  kvCacheRatio: 0.90
  preemptionsPerSecond: 0.1
  gpuTempCelsius: 85
  gpuMemoryRatio: 0.95
  gpuIdleMinutes: 30
  gpuLowUtilWithQueue: 20
  gpuThermalHeadroomCelsius: 5      # alerte quand la marge avant la température maximale de fonctionnement tombe sous ce seuil

# Limites matérielles du T4 utilisées par les KPI de santé et d'efficacité du GPU (docs/gpu/01-signaux-du-gpu.md, docs/gpu/SOURCES.md).
# 70 W, 65 TFLOPS : fiche NVIDIA du T4 (mars 2019). Bande passante : 320 Go/s (la fiche indique 300). 85 °C et 1590 MHz : relevés nvidia-smi
# publiés sur le forum NVIDIA, NON officiels : à relire avec `nvidia-smi -q` sur notre GPU (séance GPU). 0,8 : maximum pratique de DRAM_ACTIVE (doc DCGM).
gpuLimits:
  powerWatts: 70
  maxOperatingTempCelsius: 85
  smClockMaxMHz: 1590
  memoryBandwidthGBs: 320
  fp16TensorTFLOPS: 65
  dramActivePracticalMax: 0.8

# ---------------------------------------------------------------------------------------------------------------
# SLO par classe de charge (docs/sre/SLO.md). La classe est identifiée par l'alias de la clé virtuelle LiteLLM
# (api_key_alias) : un client = une classe = une clé. Les seuils sont PROPOSÉS à partir de docs/BASELINE.md et de la séance 2.
# Les seuils `le` doivent être des bornes de seaux des histogrammes LiteLLM (0.5, 1, 2, 5, 10, 30, 60, 120, 300, 420, 600).
# Un SLI « bon / mauvais » par requête ; objectif = part minimale de requêtes bonnes sur la fenêtre.
# Taux de consommation (burn rate) : seuil = part du budget consommée dans la fenêtre d'alerte x fenêtre SLO / fenêtre d'alerte
# (SRE Workbook : 2 % en 1 h -> 14,4 ; 5 % en 6 h -> 6 pour 30 jours). Changer windowDays recalcule les seuils.
# ---------------------------------------------------------------------------------------------------------------
slo:
  windowDays: 30
  fast: { budgetShare: 0.02, window: 1h, confirm: 5m }    # page : le budget fond très vite
  slow: { budgetShare: 0.05, window: 6h, confirm: 30m }   # ticket : fuite lente mais réelle
  classes:
    interactive:
      keyAlias: lab-interactive
      availability: 0.99
      ttft:  { le: "5.0", objective: 0.95 }    # 95 % des premiers tokens en <= 5 s (seaux LiteLLM : ...1, 2, 5, 10, 30, 60...)
      e2e:   { le: "30.0", objective: 0.95 }    # 95 % des requêtes terminées en <= 30 s
    rag:
      keyAlias: lab-rag
      availability: 0.99
      ttft:  { le: "10.0", objective: 0.95 }    # prompts longs : le prefill domine
      e2e:   { le: "30.0", objective: 0.95 }
    multiturn:
      keyAlias: lab-multiturn
      availability: 0.99
      ttft:  { le: "5.0", objective: 0.95 }
      e2e:   { le: "30.0", objective: 0.95 }
    batch:
      keyAlias: lab-batch
      availability: 0.99
      e2e:   { le: "300.0", objective: 0.95 }   # 95 % des requêtes en <= 5 min (pas d'utilisateur en attente)
