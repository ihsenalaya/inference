profile: smoke
namespace: inference
name: bench                     # nom du Job (suffixé par lab.sh avec un horodatage)
baseUrl: http://litellm.gateway.svc:4000        # --target litellm (défaut) ou la Gateway Istio
apiPath: ""                                    # préfixe de chemin éventuel (Gateway : /<ns>/<modèle>)
apiKey: ""
model: Qwen/Qwen2.5-7B-Instruct-AWQ            # nom exposé par le backend (LiteLLM : alias)
tokenizerModel: Qwen/Qwen2.5-7B-Instruct-AWQ
rate: 2
sweepRates: [0.5, 1, 1.5, 2, 3, 4]   # paliers du profil sweep (req/s) ; SWEEP_RATES="1,2,4,8" pour les changer
stageDuration: 90
warmup: 0                       # secondes d'échauffement avant la mesure (profil steady) ; WARMUP=60
perRequest: false               # true : un fichier par requête (calcul du goodput) ; PER_REQUEST=true
duration: 600
prometheusUrl: http://kps-prometheus.monitoring.svc:9090
