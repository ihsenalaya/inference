# Charge de DECODAGE PUR (séance GPU) : prompts très courts (16-64 tokens), 384 à 512 tokens de sortie. Le GPU ne fait presque que générer : signature mémoire.
load:
  type: constant
  stages:
    {{- if .Values.warmup }}
    - { rate: {{ .Values.rate }}, duration: {{ .Values.warmup }} }   # échauffement : stage_0, exclu de la mesure
    {{- end }}
    - { rate: {{ .Values.rate }}, duration: {{ .Values.duration }} }
data:
  type: synthetic
  input_distribution: { min: 16, max: 64, mean: 32 }
  output_distribution: { min: 384, max: 512, mean: 448 }
api:
  type: completion      # le générateur synthétique d'inference-perf v0.7.0 ne gère que /v1/completions
  streaming: true
server:
  type: vllm
  model_name: {{ .Values.model }}
  base_url: {{ .Values.baseUrl }}{{ .Values.apiPath }}
  ignore_eos: true
  {{- if .Values.apiKey }}
  api_key: {{ .Values.apiKey }}
  {{- end }}
tokenizer:
  pretrained_model_name_or_path: {{ .Values.tokenizerModel }}
{{- if .Values.prometheusUrl }}
metrics:
  type: prometheus
  prometheus:
    url: {{ .Values.prometheusUrl }}
    scrape_interval: 15
{{- end }}
storage:
  local_storage:
    path: /results
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: {{ .Values.perRequest | default false }}
  {{- if .Values.prometheusUrl }}
  prometheus:
    summary: true
    per_stage: true
  {{- end }}
