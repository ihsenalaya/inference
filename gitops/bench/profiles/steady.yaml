# Débit constant ({{ .Values.rate }} req/s) pendant {{ .Values.duration }} s (10 min par défaut).
load:
  type: constant
  stages:
    - { rate: {{ .Values.rate }}, duration: {{ .Values.duration }} }
data:
  type: synthetic
  input_distribution: { min: 128, max: 1024, mean: 512 }
  output_distribution: { min: 64, max: 256, mean: 128 }
api:
  type: chat
  streaming: true
server:
  type: vllm
  model_name: {{ .Values.model }}
  base_url: {{ .Values.baseUrl }}{{ .Values.apiPath }}
  ignore_eos: true
  {{- if .Values.apiKey }}
  api_key: {{ .Values.apiKey }}
  {{- end }}
tokenizer:
  pretrained_model_name_or_path: {{ .Values.tokenizerModel }}
{{- if .Values.prometheusUrl }}
metrics:
  type: prometheus
  prometheus:
    url: {{ .Values.prometheusUrl }}
    scrape_interval: 15
{{- end }}
storage:
  local_storage:
    path: /results
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
  {{- if .Values.prometheusUrl }}
  prometheus:
    summary: true
    per_stage: true
  {{- end }}
observability:
  metrics:
    port: 9464
    linger_seconds: 30
