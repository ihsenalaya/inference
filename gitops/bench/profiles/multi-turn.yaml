# Conversations à contexte croissant : le contexte de chaque session est ajouté à chaque requête.
load:
  type: constant
  stages:
    - { rate: {{ .Values.rate }}, duration: {{ .Values.duration }} }
data:
  type: shared_prefix
  shared_prefix:
    num_unique_system_prompts: 2
    num_users_per_system_prompt: 8
    system_prompt_len: 256
    question_len: 64
    output_len: 128
    max_model_len: 4096
    enable_multi_turn_chat: true
api:
  type: chat
  streaming: true
server:
  type: vllm
  model_name: {{ .Values.model }}
  base_url: {{ .Values.baseUrl }}{{ .Values.apiPath }}
  ignore_eos: true
  {{- if .Values.apiKey }}
  api_key: {{ .Values.apiKey }}
  {{- end }}
tokenizer:
  pretrained_model_name_or_path: {{ .Values.tokenizerModel }}
{{- if .Values.prometheusUrl }}
metrics:
  type: prometheus
  prometheus:
    url: {{ .Values.prometheusUrl }}
    scrape_interval: 15
{{- end }}
storage:
  local_storage:
    path: /results
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
  {{- if .Values.prometheusUrl }}
  prometheus:
    summary: true
    per_stage: true
  {{- end }}
observability:
  metrics:
    port: 9464
    linger_seconds: 30
