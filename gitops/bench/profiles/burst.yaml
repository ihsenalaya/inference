# Pic de charge : déclenche KEDA (1 -> 2 réplicas) puis retour au calme.
load:
  type: constant
  stages:
    - { rate: 1, duration: 60 }
    - { rate: {{ .Values.rate }}, duration: {{ .Values.duration }} }
    - { rate: 1, duration: 120 }
data:
  type: synthetic
  input_distribution: { min: 128, max: 512, mean: 256 }
  output_distribution: { min: 64, max: 256, mean: 128 }
api:
  type: completion      # le générateur synthétique d'inference-perf v0.7.0 ne gère que /v1/completions
  streaming: true
server:
  type: vllm
  model_name: {{ .Values.model }}
  base_url: {{ .Values.baseUrl }}{{ .Values.apiPath }}
  ignore_eos: true
  {{- if .Values.apiKey }}
  api_key: {{ .Values.apiKey }}
  {{- end }}
tokenizer:
  pretrained_model_name_or_path: {{ .Values.tokenizerModel }}
{{- if .Values.prometheusUrl }}
metrics:
  type: prometheus
  prometheus:
    url: {{ .Values.prometheusUrl }}
    scrape_interval: 15
{{- end }}
storage:
  local_storage:
    path: /results
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
  {{- if .Values.prometheusUrl }}
  prometheus:
    summary: true
    per_stage: true
  {{- end }}
