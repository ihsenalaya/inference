# Classe RAG (SLO) : prompts de 2 000 à 3 500 tokens, réponse courte. Stress du prefill (piège B2, backend d'attention sur T4). Débit : ragRate (0,5 req/s par défaut).
# max-model-len = 4096 : sortie courte pour rester sous la limite.
load:
  type: constant
  stages:
    {{- if .Values.warmup }}
    - { rate: {{ .Values.ragRate }}, duration: {{ .Values.warmup }} }   # échauffement : stage_0, exclu de la mesure
    {{- end }}
    - { rate: {{ .Values.ragRate }}, duration: {{ .Values.duration }} }
data:
  type: synthetic
  input_distribution: { min: 2000, max: 3500, mean: 2750 }
  output_distribution: { min: 16, max: 64, mean: 32 }
api:
  type: completion      # le générateur synthétique d'inference-perf v0.7.0 ne gère que /v1/completions
  streaming: true
server:
  type: vllm
  model_name: {{ .Values.model }}
  base_url: {{ .Values.baseUrl }}{{ .Values.apiPath }}
  ignore_eos: true
  {{- if .Values.apiKey }}
  api_key: {{ .Values.apiKey }}
  {{- end }}
tokenizer:
  pretrained_model_name_or_path: {{ .Values.tokenizerModel }}
{{- if .Values.prometheusUrl }}
metrics:
  type: prometheus
  prometheus:
    url: {{ .Values.prometheusUrl }}
    scrape_interval: 15
{{- end }}
storage:
  local_storage:
    path: /results
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: {{ .Values.perRequest | default false }}
  {{- if .Values.prometheusUrl }}
  prometheus:
    summary: true
    per_stage: true
  {{- end }}
