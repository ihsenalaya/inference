# Montée en débit jusqu'à saturation : débit maximal sous SLO. inference-perf détecte la saturation puis génère les paliers.
load:
  type: constant
  interval: 15
  sweep:
    type: linear
    timeout: 90
    num_stages: 6
    stage_duration: 90
    saturation_percentile: 95
data:
  type: synthetic
  input_distribution: { min: 128, max: 1024, mean: 512 }
  output_distribution: { min: 64, max: 256, mean: 128 }
api:
  type: chat
  streaming: true
server:
  type: vllm
  model_name: {{ .Values.model }}
  base_url: {{ .Values.baseUrl }}{{ .Values.apiPath }}
  ignore_eos: true
  {{- if .Values.apiKey }}
  api_key: {{ .Values.apiKey }}
  {{- end }}
tokenizer:
  pretrained_model_name_or_path: {{ .Values.tokenizerModel }}
metrics:
  type: prometheus
  prometheus:
    url: {{ .Values.prometheusUrl }}
    scrape_interval: 15
storage:
  local_storage:
    path: /results
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
  prometheus:
    summary: true
    per_stage: true
observability:
  metrics:
    port: 9464
    linger_seconds: 30
