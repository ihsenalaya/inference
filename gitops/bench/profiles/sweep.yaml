# Montée en débit jusqu'à saturation : débit maximal sous SLO, lu palier par palier dans stage_N_lifecycle_metrics.json.
load:
  type: constant
  stages:        # paliers explicites : le sweep automatique d'inference-perf v0.7.0 échoue (index out of bounds dans le prétraitement)
    - { rate: 0.5, duration: 90 }
    - { rate: 1, duration: 90 }
    - { rate: 1.5, duration: 90 }
    - { rate: 2, duration: 90 }
    - { rate: 3, duration: 90 }
    - { rate: 4, duration: 90 }
data:
  type: synthetic
  input_distribution: { min: 128, max: 1024, mean: 512 }
  output_distribution: { min: 64, max: 256, mean: 128 }
api:
  type: completion      # le générateur synthétique d'inference-perf v0.7.0 ne gère que /v1/completions
  streaming: true
server:
  type: vllm
  model_name: {{ .Values.model }}
  base_url: {{ .Values.baseUrl }}{{ .Values.apiPath }}
  ignore_eos: true
  {{- if .Values.apiKey }}
  api_key: {{ .Values.apiKey }}
  {{- end }}
tokenizer:
  pretrained_model_name_or_path: {{ .Values.tokenizerModel }}
{{- if .Values.prometheusUrl }}
metrics:
  type: prometheus
  prometheus:
    url: {{ .Values.prometheusUrl }}
    scrape_interval: 15
{{- end }}
storage:
  local_storage:
    path: /results
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
  {{- if .Values.prometheusUrl }}
  prometheus:
    summary: true
    per_stage: true
  {{- end }}
