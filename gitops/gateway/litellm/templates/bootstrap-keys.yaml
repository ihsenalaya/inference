# Hook PostSync : crée les équipes lab-bench (sans limite) et lab-user (budget, rpm, tpm), plus une équipe et une clé
# par classe de charge SLO (lab-interactive, lab-rag, lab-multiturn, lab-batch : l'alias de clé identifie la classe dans
# les métriques LiteLLM), et range les clés dans le Secret litellm-keys. Idempotent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-bootstrap
  namespace: gateway
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-bootstrap
  namespace: gateway
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-bootstrap
  namespace: gateway
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: litellm-bootstrap }
subjects:
  - { kind: ServiceAccount, name: litellm-bootstrap, namespace: gateway }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-bootstrap-keys
  namespace: gateway
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: litellm-bootstrap
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrapImage }}
          envFrom:
            - secretRef: { name: litellm-secrets }
          command: ["/bin/bash", "-ec"]
          args:
            - |
              H="Authorization: Bearer ${LITELLM_MASTER_KEY}"
              U=http://litellm.gateway.svc:4000
              until curl -fs "$U/health/readiness" >/dev/null; do sleep 5; done
              if kubectl -n gateway get secret litellm-keys >/dev/null 2>&1; then echo "litellm-keys existe déjà"; exit 0; fi
              mk_team() {
                curl -fs -H "$H" -H 'Content-Type: application/json' -d "{\"team_alias\":\"$1\" $2}" "$U/team/new" | jq -r .team_id
              }
              mk_key() {
                curl -fs -H "$H" -H 'Content-Type: application/json' -d "{\"key_alias\":\"$1\",\"team_id\":\"$2\"}" "$U/key/generate" | jq -r .key
              }
              bench=$(mk_team lab-bench "")
              user=$(mk_team lab-user ',"max_budget":5,"rpm_limit":60,"tpm_limit":20000')
              kb=$(mk_key lab-bench-key "$bench"); ku=$(mk_key lab-user-key "$user")
              args=(--from-literal=lab-bench="$kb" --from-literal=lab-user="$ku")
              for c in interactive rag multiturn batch; do
                t=$(mk_team "lab-$c" ""); k=$(mk_key "lab-$c" "$t"); args+=(--from-literal="lab-$c=$k")
              done
              kubectl -n gateway create secret generic litellm-keys "${args[@]}"
