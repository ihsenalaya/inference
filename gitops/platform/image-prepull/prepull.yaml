# Pré-tirage de l'image vLLM (~9 Go) sur les nœuds GPU, dès qu'ils sont prêts.
#
# Sans cela, l'image n'est tirée qu'au démarrage du pod vLLM, APRÈS le téléchargement du modèle (init container) :
# 3 min 35 de plus avant le premier démarrage d'un nœud (mesuré, docs/BASELINE.md §3). Ici le pull se fait en parallèle
# de l'installation du driver NVIDIA (~3 min) et du téléchargement du modèle.
#
# Le conteneur d'init tire l'image et sort ; le conteneur principal est un `pause` de quelques Ko.
# ATTENTION : l'image doit rester identique à `vllm.image` de gitops/serving/chart/values.yaml
# (vérifié par tests/static.sh).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-prepull
  namespace: inference
  labels:
    app.kubernetes.io/name: image-prepull
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: image-prepull
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-prepull
    spec:
      nodeSelector:
        workload: inference
      tolerations:
        - { key: sku, operator: Equal, value: gpu, effect: NoSchedule }
      terminationGracePeriodSeconds: 0
      initContainers:
        - name: vllm
          image: vllm/vllm-openai@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
          command: ["/bin/sh", "-c", "exit 0"]
          resources:
            requests: { cpu: 1m, memory: 4Mi }
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 16Mi }
