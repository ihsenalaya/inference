# AKS + GPU Operator : le pool GPU est créé avec gpu_driver=None, et le GPU managé
# d'AKS n'est PAS activé (sinon double device plugin / DCGM). Le driver est donc
# installé par l'opérateur. Voir docs/DECISIONS.md.
driver:
  enabled: true
  version: "580.95.05"     # branche production 580 : supporte le T4 (Turing) et CUDA 13.0 requis par l'image vLLM (>= 580)
toolkit:
  enabled: true
operator:
  defaultRuntime: containerd
devicePlugin:
  enabled: true
daemonsets:
  tolerations:
    - { key: sku, operator: Equal, value: gpu, effect: NoSchedule }
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
node-feature-discovery:
  worker:
    tolerations:
      - { key: sku, operator: Equal, value: gpu, effect: NoSchedule }
dcgmExporter:
  enabled: true
  enablePodLabels: true
  serviceMonitor:
    enabled: true
    interval: 15s
    honorLabels: true        # sans cela, pod/namespace deviennent exported_* et la jointure avec vLLM casse
  config:
    create: true
    name: dcgm-metrics
    data: |-
      # DCGM field, type, help  (liste minimale du lab ; retirer ce que le T4 ne fournit pas)
      DCGM_FI_DEV_GPU_UTIL, gauge, Utilisation GPU (%).
      DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Utilisation du bus mémoire (%).
      DCGM_FI_DEV_FB_USED, gauge, Mémoire GPU utilisée (MiB).
      DCGM_FI_DEV_FB_FREE, gauge, Mémoire GPU libre (MiB).
      DCGM_FI_DEV_POWER_USAGE, gauge, Puissance (W).
      DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Énergie cumulée (mJ).
      DCGM_FI_DEV_GPU_TEMP, gauge, Température (C).
      DCGM_FI_DEV_SM_CLOCK, gauge, Fréquence SM (MHz).
      DCGM_FI_DEV_MEM_CLOCK, gauge, Fréquence mémoire (MHz).
      DCGM_FI_DEV_XID_ERRORS, gauge, Dernière erreur XID.
      DCGM_FI_DEV_CLOCK_THROTTLE_REASONS, gauge, Raisons de throttling (bitmask).
      DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Rejeux PCIe.
      DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, Erreurs ECC simples.
      DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, Erreurs ECC doubles.
      DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Activité du moteur graphique (ratio).
      DCGM_FI_PROF_DRAM_ACTIVE, gauge, Activité de la mémoire (ratio).
      DCGM_FI_PROF_PCIE_TX_BYTES, counter, Octets PCIe émis.
      DCGM_FI_PROF_PCIE_RX_BYTES, counter, Octets PCIe reçus.
