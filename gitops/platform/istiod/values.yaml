# Istio upstream en passerelle seulement (istiod seul, pas de passerelle Istio ni de sidecar : le Helm chart n'a pas de profil "minimal", c'est un profil istioctl).
autoscaleEnabled: false
replicaCount: 1
# Images Istio tirées de Docker Hub plutôt que du registre par défaut du chart 1.30 (registry.istio.io), que le projet Istio arrête le 16/12/2026
# (coupures de test annoncées, dont le 17/11/2026 de 15 h à 21 h UTC : HTTP 403, istiod et la Gateway en ImagePullBackOff). Voir docs/DECISIONS.md D-41.
global:
  hub: docker.io/istio
resources:
  requests: { cpu: 50m, memory: 192Mi }
pilot:
  env:
    SUPPORT_GATEWAY_API_INFERENCE_EXTENSION: "true"
    ENABLE_GATEWAY_API_INFERENCE_EXTENSION: "true"
meshConfig:
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  defaultConfig:
    proxyStatsMatcher:
      inclusionRegexps: [".*"]
