# Istio upstream en passerelle seulement (istiod seul, pas de passerelle Istio ni de sidecar : le Helm chart n'a pas de profil "minimal", c'est un profil istioctl).
autoscaleEnabled: false
replicaCount: 1
# Images Istio tirées de Docker Hub plutôt que du registre par défaut du chart 1.30 (registry.istio.io).
# Le 17/11/2026, registry.istio.io refusait le jeton anonyme (HTTP 403) depuis les nœuds AKS comme depuis un poste : istiod et la Gateway restaient en ImagePullBackOff
# (docs/DECISIONS.md D-41). docker.io/istio/pilot et proxyv2 en 1.30.8 existent (vérifié).
global:
  hub: docker.io/istio
resources:
  requests: { cpu: 50m, memory: 192Mi }
pilot:
  env:
    SUPPORT_GATEWAY_API_INFERENCE_EXTENSION: "true"
    ENABLE_GATEWAY_API_INFERENCE_EXTENSION: "true"
meshConfig:
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  defaultConfig:
    proxyStatsMatcher:
      inclusionRegexps: [".*"]
