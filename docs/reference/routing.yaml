- apiVersion: inference.networking.k8s.io/v1
  kind: InferencePool
  metadata:
    name: qwen-1-5b-inference-pool
    namespace: inference
    labels:
      app.kubernetes.io/component: llminferenceservice-router-scheduler
      app.kubernetes.io/name: qwen-1-5b
      app.kubernetes.io/part-of: llminferenceservice
  spec:
    appProtocol: http
    endpointPickerRef:
      failureMode: FailOpen
      group: ''
      kind: Service
      name: qwen-1-5b-epp-service
      port:
        number: 9002
    selector:
      matchLabels:
        app.kubernetes.io/name: qwen-1-5b
        app.kubernetes.io/part-of: llminferenceservice
        kserve.io/component: workload
    targetPorts:
    - number: 8000

- apiVersion: networking.istio.io/v1
  kind: DestinationRule
  metadata:
    name: qwen-1-5b-epp-tls
    namespace: inference
    annotations:
      argocd.argoproj.io/tracking-id: serving:networking.istio.io/DestinationRule:inference/qwen-1-5b-epp-tls
  spec:
    host: qwen-1-5b-epp-service.inference.svc.cluster.local
    trafficPolicy:
      tls:
        insecureSkipVerify: true
        mode: SIMPLE

- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    name: inference-gateway
    namespace: inference
    annotations:
      argocd.argoproj.io/tracking-id: inference-gateway:gateway.networking.k8s.io/Gateway:inference/inference-gateway
      networking.istio.io/service-type: ClusterIP
  spec:
    gatewayClassName: istio
    listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      name: http
      port: 80
      protocol: HTTP

